header:
  version: 14

machine: raspberrypi5
distro: pi-trustee-distro
target: pi-trustee

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    branch: master
    layers: {}

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/openembedded-core
    branch: master
    layers:
      meta:
  
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    branch: master
    layers:
      meta-poky:
    
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: master

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: master
    layers:
      meta-oe:
      meta-networking:
      meta-python:
      meta-filesystems:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: master

  meta-pi-trustee:
env:
  CONTAINER_ARCHIVE: null
local_conf_header:
  base: |
    CONF_VERSION = "2"
    # There is an issue with this recipe in wrynose currently; not needed
    BBMASK += "meta-networking/recipes-devtools/python/python3-scapy_.*\.bb"

  external_artifacts: |
    CONTAINER_TARS = "${@os.environ.get('CONTAINER_ARCHIVE', '/cache/containers')}"
  perf: |
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
    # Note: by default distro is headless, but these optimize if desktop env is installed
    # Throttle concurrency for memory-intensive toolchain builds to prevent Docker OOM (exit 137)
    PARALLEL_MAKE:pn-llvm-native = "-j 2"
    PARALLEL_MAKE:pn-clang-native = "-j 2"
    PARALLEL_MAKE:pn-rust-native = "-j 2"
    # Restrict LLVM targets to Pi 5 target architectures to reduce build time & RAM usage
    LLVM_TARGETS_TO_BUILD ?= "AArch64;ARM;BPF"

  rpi5: |
    # Minimal GPU memory allocation for a headless build
    GPU_MEM = "16"
    ENABLE_UART = "0"
    # Accept Synaptics firmware license required by Pi 5 WiFi firmware packages
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
    # Enable cgroups for k3s container runtime
    CMDLINE:append = " cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory"
