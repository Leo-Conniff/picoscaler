{{- if .Values.kbs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustee-kbs
  labels:
    {{- include "trustee.labels" . | nindent 4 }}
    app.kubernetes.io/name: trustee-kbs
    app.kubernetes.io/component: kbs
spec:
  replicas: {{ .Values.kbs.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trustee-kbs
      app.kubernetes.io/component: kbs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustee-kbs
        app.kubernetes.io/component: kbs
    spec:
      containers:
        - name: kbs
          image: "{{ .Values.kbs.image.repository }}:{{ .Values.kbs.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.kbs.image.pullPolicy | quote }}
          command: ["/usr/local/bin/kbs"]
          args:
            - "--config-file"
            - "/etc/kbs/kbs-config.toml"
          ports:
            - name: http
              containerPort: {{ .Values.kbs.service.targetPort }}
              protocol: TCP
          env:
            - name: AS_ADDR
              value: {{ .Values.kbs.config.asAddr | quote }}
            - name: RVPS_ADDR
              value: {{ .Values.kbs.config.rvpsAddr | quote }}
          resources:
            {{- toYaml .Values.kbs.resources | nindent 12 }}
          volumeMounts:
            - name: kbs-config
              mountPath: /etc/kbs
            {{- if .Values.kbs.persistence.enabled }}
            - name: kbs-repo
              mountPath: {{ .Values.kbs.config.repositoryDir }}
            - name: kbs-certs
              mountPath: {{ .Values.kbs.config.authPublicKeysDir }}
            {{- end }}
      volumes:
        - name: kbs-config
          configMap:
            name: trustee-kbs-config
        {{- if .Values.kbs.persistence.enabled }}
        - name: kbs-repo
          hostPath:
            path: {{ .Values.kbs.persistence.hostPath }}/{{ .Values.kbs.persistence.kbsSubPath }}
            type: DirectoryOrCreate
        - name: kbs-certs
          hostPath:
            path: {{ .Values.kbs.persistence.hostPath }}/{{ .Values.kbs.persistence.certsSubPath }}
            type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trustee-kbs-config
  labels:
    {{- include "trustee.labels" . | nindent 4 }}
    app.kubernetes.io/name: trustee-kbs
data:
  kbs-config.toml: |
    sockets = ["0.0.0.0:{{ .Values.kbs.service.targetPort }}"]
    auth_public_key_dir = "{{ .Values.kbs.config.authPublicKeysDir }}"
    insecure_http = {{ .Values.kbs.config.insecureHttp }}
    
    [as_config]
    as_addr = "{{ .Values.kbs.config.asAddr }}"
    
    [rvps_config]
    rvps_addr = "{{ .Values.kbs.config.rvpsAddr }}"

    [repository_config]
    type = "LocalFs"
    dir_path = "{{ .Values.kbs.config.repositoryDir }}"
---
apiVersion: v1
kind: Service
metadata:
  name: trustee-kbs
  labels:
    {{- include "trustee.labels" . | nindent 4 }}
    app.kubernetes.io/name: trustee-kbs
spec:
  type: {{ .Values.kbs.service.type }}
  ports:
    - port: {{ .Values.kbs.service.port }}
      targetPort: {{ .Values.kbs.service.targetPort }}
      protocol: TCP
      name: http
      {{- if and (eq .Values.kbs.service.type "NodePort") .Values.kbs.service.nodePort }}
      nodePort: {{ .Values.kbs.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: trustee-kbs
    app.kubernetes.io/component: kbs
{{- end }}
